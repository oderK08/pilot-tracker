name: Mettre à jour l'archive des pilotes suivis

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Quels pilotes mettre à jour"
        type: choice
        options:
          - tous
          - hedge_fund
          - congress
        default: tous
      rebuild:
        description: "Reconstruire les archives 13F depuis zéro (hedge funds uniquement, sans risque : EDGAR conserve tout)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Le run planifié (schedule) ne fournit aucune entrée : les valeurs
      # sont alors vides et on retombe sur le comportement par défaut,
      # c'est-à-dire tous les pilotes, sans reconstruction.
      - name: Mettre à jour l'archive
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          ONLY: ${{ inputs.only }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          ARGS=""
          if [ -n "$ONLY" ] && [ "$ONLY" != "tous" ]; then
            ARGS="$ARGS --only $ONLY"
          fi
          if [ "$REBUILD" = "true" ]; then
            ARGS="$ARGS --rebuild"
          fi
          echo "python update_archive.py $ARGS"
          python update_archive.py $ARGS

      - name: Committer l'archive mise à jour
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data_archive/
          git diff --staged --quiet || git commit -m "Mise à jour automatique de l'archive"
          git push
