name: Générer le rapport pilot-tracker

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      pilot_type:
        description: "Type de pilote"
        required: true
        type: choice
        options:
          - congress
          - hedge_fund
        default: congress
      name:
        description: 'Nom exact (ex: "Nancy Pelosi" ou "Berkshire Hathaway")'
        required: true
        type: string
      quarters:
        description: "Trimestres affichés (hedge fund uniquement)"
        type: choice
        options: ["3", "4", "6", "8"]
        default: "3"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le rapport
        env:
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          python generate_report.py \
            --pilot "${{ inputs.pilot_type }}" \
            --name "${{ inputs.name }}" \
            --quarters "${{ inputs.quarters }}"

      # data_archive/ est commité au même titre que output/ : un pilote hors
      # de la liste suivie (voir tracked_pilots.py) n'a aucune archive au
      # premier run et télécharge donc tout depuis EDGAR. Sans cette ligne,
      # ce téléchargement était jeté à la fin du job et chaque nouveau
      # rapport sur le même gérant refaisait la soixantaine de requêtes SEC.
      # Conservé, il rend tous les runs suivants instantanés et hors ligne.
      - name: Sauvegarder les résultats dans le repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/ data_archive/
          git diff --staged --quiet || git commit -m "Rapport généré: ${{ inputs.name }}"
          git push
